<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程学习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        /* 密码保护 */
        #password-gate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .password-box {
            text-align: center;
            padding: 40px;
        }
        .password-box h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .password-input {
            width: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 16px;
        }
        .password-input:focus {
            outline: none;
            border-color: #4a90e2;
        }
        .password-btn {
            padding: 12px 32px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .password-btn:hover {
            background: #357abd;
        }
        .password-error {
            color: #e74c3c;
            margin-top: 12px;
            display: none;
        }
        /* 主内容 */
        #main-content {
            display: none;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .video-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .video-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 16px;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
        }
        .video-placeholder-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .video-placeholder-text {
            font-size: 14px;
        }
        /* 多吉云播放器容器 */
        #player_31669f3ca1382ef1 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
        .video-info {
            margin-top: 16px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .video-info-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .video-info-meta {
            font-size: 13px;
            color: #888;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 12px;
        }
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .header, .video-section {
                padding: 20px;
            }
            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 密码保护 -->
    <div id="password-gate">
        <div class="password-box">
            <h2>🔒 课程访问</h2>
            <input type="password" id="password-input" class="password-input" placeholder="请输入访问密码" maxlength="20">
            <br>
            <button class="password-btn" onclick="checkPassword()">进入课程</button>
            <div class="password-error" id="password-error">密码错误，请重试</div>
        </div>
    </div>
    <!-- 主内容 -->
    <div id="main-content">
        <div class="container">
            <div class="header">
                <h1>📐 高中数学精品课程</h1>
                <p>系统讲解 · 深入浅出 · 高效提分</p >
            </div>
            <div class="video-section">
                <h2>🎬 课程视频</h2>
                <div class="video-container">
                    <!-- 视频占位（未解锁时显示） -->
                    <div class="video-placeholder" id="video-placeholder">
                        <div class="video-placeholder-icon">🎥</div>
                        <div class="video-placeholder-text">视频配置中，请稍候...</div>
                    </div>
                    <!-- 多吉云播放器容器 -->
                    <div id="player_31669f3ca1382ef1"></div>
                </div>
                <div class="video-info">
                    <div class="video-info-title">第一讲：课程导学与基础梳理</div>
                    <div class="video-info-meta">时长：待更新 · 难度：基础</div>
                </div>
            </div>
            <div class="footer">
                © 2024 高中数学精品课程 · 版权所有
            </div>
        </div>
    </div>

    <!-- 多吉云播放器SDK -->
    <script type="text/javascript" src="https://player.dogecloud.com/js/loader"></script>
    <script>
        // 密码验证
        const CORRECT_PASSWORD = '1949101';
        let dogePlayer = null;

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            if (input === CORRECT_PASSWORD) {
                document.getElementById('password-gate').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                // 密码正确之后，才初始化多吉云播放器
                initDogePlayer();
            } else {
                document.getElementById('password-error').style.display = 'block';
                document.getElementById('password-input').value = '';
            }
        }

        // 回车提交密码
        document.getElementById('password-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // 初始化多吉云播放器
        function initDogePlayer() {
            document.getElementById('video-placeholder').style.display = 'none';
            document.getElementById('player_31669f3ca1382ef1').style.display = 'block';
            dogePlayer = new DogePlayer({
                container: document.getElementById('player_31669f3ca1382ef1'),
                userId: 16170,
                vcode: '31669f3ca1382ef1',
                autoPlay: false
            });
        }

        window.onload = function() {
            document.getElementById('password-input').focus();
        };
    </script>
</body>
</html>
